name: CI

on:
  push:
    branches: ["**"]
  pull_request:
    branches: [main]

permissions:
  contents: read

jobs:
  backend:
    name: Backend tests
    runs-on: ubuntu-latest
    services:
      postgres:
        image: postgres:15
        env:
          POSTGRES_DB: audioguia
          POSTGRES_USER: postgres
          POSTGRES_PASSWORD: postgres
        ports:
          - 5432:5432
        options: >-
          --health-cmd "pg_isready -U postgres -d audioguia"
          --health-interval 10s
          --health-timeout 5s
          --health-retries 5

    defaults:
      run:
        working-directory: backend

    steps:
      - name: Checkout
        uses: actions/checkout@v4

      - name: Set up Python
        uses: actions/setup-python@v5
        with:
          python-version: "3.12"

      - name: Install uv
        uses: astral-sh/setup-uv@v6
        with:
          version: "latest"
          enable-cache: true

      - name: Install dependencies
        run: uv sync --locked --extra dev

      - name: Create test database
        run: |
          PGPASSWORD=postgres psql \
            --host localhost \
            --username postgres \
            --dbname audioguia \
            --command "CREATE DATABASE audioguia_test;"
        working-directory: .

      - name: Apply migrations
        run: uv run alembic upgrade head
        env:
          ALEMBIC_DATABASE_URL: postgresql+asyncpg://postgres:postgres@localhost:5432/audioguia_test
          DATABASE_URL: postgresql+asyncpg://postgres:postgres@localhost:5432/audioguia
          TEST_DATABASE_URL: postgresql+asyncpg://postgres:postgres@localhost:5432/audioguia_test
          SECRET_KEY: ci-only-secret
          ALGORITHM: HS256
          PUBLIC_FRONTEND_URL: http://localhost:3000
          CORS_ORIGINS: http://localhost:3000
          STORAGE_ENDPOINT_URL: https://example.com
          STORAGE_ACCESS_KEY_ID: ci-only-access-key
          STORAGE_SECRET_ACCESS_KEY: ci-only-secret-key
          STORAGE_BUCKET_NAME: ci-only-bucket

      - name: Run tests
        run: uv run pytest
        env:
          DATABASE_URL: postgresql+asyncpg://postgres:postgres@localhost:5432/audioguia
          TEST_DATABASE_URL: postgresql+asyncpg://postgres:postgres@localhost:5432/audioguia_test
          SECRET_KEY: ci-only-secret
          ALGORITHM: HS256
          PUBLIC_FRONTEND_URL: http://localhost:3000
          CORS_ORIGINS: http://localhost:3000
          STORAGE_ENDPOINT_URL: https://example.com
          STORAGE_ACCESS_KEY_ID: ci-only-access-key
          STORAGE_SECRET_ACCESS_KEY: ci-only-secret-key
          STORAGE_BUCKET_NAME: ci-only-bucket

  frontend:
    name: Frontend lint and build
    runs-on: ubuntu-latest
    defaults:
      run:
        working-directory: frontend

    steps:
      - name: Checkout
        uses: actions/checkout@v4

      - name: Set up Node.js
        uses: actions/setup-node@v4
        with:
          node-version: 22
          cache: npm
          cache-dependency-path: frontend/package-lock.json

      - name: Install dependencies
        run: npm ci

      - name: Lint
        run: npm run lint

      - name: Build
        run: npm run build
